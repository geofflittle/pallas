[package]
name = "pallas-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pallas-codec = { path = "../pallas-merge/pallas-codec" }
pallas-crypto = { path = "../pallas-merge/pallas-crypto" }
pallas-primitives = { path = "../pallas-merge/pallas-primitives", features = ["unstable"] }
pallas-traverse = { path = "../pallas-merge/pallas-traverse", features = ["unstable"] }
pallas-utxorpc = { path = "../pallas-merge/pallas-utxorpc", features = ["unstable"] }
hex = "0.4"
serde_json = "1"

[patch.crates-io]
utxorpc-spec = { git = "https://github.com/SundaeSwap-finance/utxorpc-spec", rev = "4bef71401bae7e9fc80b9d24379be0f9078b0ff5" }
