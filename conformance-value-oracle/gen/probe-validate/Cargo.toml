[package]
name = "pallas-probe-validate"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pallas-addresses = { path = "../../conf/pallas-addresses" }
pallas-codec = { path = "../../conf/pallas-codec" }
pallas-crypto = { path = "../../conf/pallas-crypto" }
pallas-primitives = { path = "../../conf/pallas-primitives", features = ["unstable"] }
pallas-traverse = { path = "../../conf/pallas-traverse", features = ["unstable"] }
pallas-validate = { path = "../../conf/pallas-validate", features = ["unstable", "phase2"] }
chrono = "0.4"
hex = "0.4"
serde_json = "1"
