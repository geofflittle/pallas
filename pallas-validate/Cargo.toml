[package]
name = "pallas-validate"
description = "Utilities for validating transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
documentation = "https://docs.rs/pallas-validate"
readme = "README.md"

[dependencies]
pallas-addresses.workspace = true
pallas-codec.workspace = true
pallas-crypto.workspace = true
pallas-primitives.workspace = true
pallas-traverse.workspace = true
hex.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
itertools.workspace = true
tracing.workspace = true
crc = { version = "3.0.1", optional = true }
blst = { version = "0.3", optional = true }

# phase2 dependencies
amaru-uplc = { version = "0.1.0", optional = true }

# The Dijkstra evaluator needs a nightly toolchain, so it builds only with `--cfg pallas_dijkstra_evaluator`.
[target.'cfg(pallas_dijkstra_evaluator)'.dependencies]
amaru-uplc-dijkstra = { package = "amaru-uplc", version = "0.4.0", git = "https://github.com/SundaeSwap-finance/amaru.git", rev = "9db2173bafecc98aa9f0f5c3f93613fadfeb2f99", optional = true }
amaru-kernel = { version = "0.1.2", git = "https://github.com/SundaeSwap-finance/amaru.git", rev = "9db2173bafecc98aa9f0f5c3f93613fadfeb2f99", optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
phase2 = ["amaru-uplc"]
unstable = [
    "pallas-traverse/unstable",
    "pallas-primitives/unstable",
    "dep:crc",
    "dep:blst",
    "dep:amaru-uplc-dijkstra",
    "dep:amaru-kernel",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pallas_dijkstra_evaluator)"] }
