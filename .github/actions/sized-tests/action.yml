name: Sized tests
description: Run the tests of one size from one nextest archive under its time limit.

inputs:
  archive:
    description: The archive under archives/ that the build job wrote, without its extension.
    required: true
  size:
    description: The test group of .config/nextest.toml to run, small, medium or large.
    required: true

runs:
  using: composite
  steps:
    - name: Tests
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        SIZE: ${{ inputs.size }}
      run: cargo-nextest nextest run --archive-file "archives/$ARCHIVE.tar.zst" --no-fail-fast --no-tests fail --run-ignored all -E "group($SIZE)"
