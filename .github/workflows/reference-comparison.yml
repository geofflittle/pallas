name: Reference comparison

# GitHub dispatches a workflow off the default branch only after a run of it, which the push makes.
on:
  push:
    paths: [.github/workflows/reference-comparison.yml]
  workflow_dispatch:
    inputs:
      pallas_ref:
        description: The pallas commit to compare and report on
        required: true
      pallas_base:
        description: The pallas commit pallas_ref builds on, which each stable comparison reads as its base
        required: false

permissions:
  contents: read
  statuses: write

env:
  DOLOS_REF: 0c3afef80987bc47870dd44f45b0037733e2ec2b
  TOOLCHAIN: nightly-2026-09-04
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  targets:
    name: targets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      targets: ${{ steps.list.outputs.targets }}
      stable: ${{ steps.list.outputs.stable }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pallas_ref }}
          path: pallas-head
          persist-credentials: false
      - name: Resolve the pallas commit
        id: commit
        working-directory: pallas-head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/dolos
          ref: ${{ env.DOLOS_REF }}
          path: dolos
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      # A target that requires the stable feature compares a build without unstable with a base build.
      - name: List the comparison's test targets
        id: list
        working-directory: dolos/reference-comparison
        run: |
          tests=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[] | select(.name == "reference-comparison") | .targets[] | select(.kind | index("test"))]')
          targets=$(jq -c '[.[] | select(.["required-features"] // [] | index("stable") | not) | .name]' <<< "$tests")
          stable=$(jq -c '[.[] | select(.["required-features"] // [] | index("stable")) | .name]' <<< "$tests")
          if [ "$(jq length <<< "$targets")" = 0 ] || [ "$(jq length <<< "$stable")" = 0 ]; then
            echo "::error::the Dolos comparison at $DOLOS_REF declares no test target of a kind: $targets $stable"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      - name: Report every target as pending
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TARGETS: ${{ steps.list.outputs.targets }}
          STABLE: ${{ steps.list.outputs.stable }}
        run: |
          for target in $(jq -r '.[]' <<< "$TARGETS") $(jq -r '.[]' <<< "$STABLE"); do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
              -f context="reference-comparison/$target" -f target_url="$RUN_URL" \
              -f description="queued at dolos ${DOLOS_REF:0:8}"
          done

  compare:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      CONTEXT: reference-comparison/${{ matrix.target }}
      SHA: ${{ needs.targets.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.sha }}
          path: pallas-head
          persist-credentials: false
      - name: Report the comparison as running
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="running at dolos ${DOLOS_REF:0:8}"
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/dolos
          ref: ${{ env.DOLOS_REF }}
          path: dolos
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          key: ${{ matrix.target }}
      - name: Run the comparison
        id: run
        working-directory: dolos/reference-comparison
        run: |
          rc=0
          cargo nextest run --no-fail-fast --run-ignored all --test "$TARGET" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # The ledger commit pallas copied the era's CDDL from, and the one that wrote the era's samples.
      - name: Read the era's ledger commits
        id: ledger
        if: always() && startsWith(matrix.target, 'dataset-')
        run: |
          era=${TARGET#dataset-}
          cddl=$(head -n 1 "pallas-head/pallas-primitives/src/$era/defs.cddl" 2>/dev/null \
            | grep -oE 'cardano-ledger commit [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)
          samples=$(jq -r '.implementation_commit // empty' \
            "dolos/test_data/cardano-cbor-dataset/dataset/reports/$era/haskell-latest.json" 2>/dev/null \
            | grep -xE '[0-9a-f]{40}' || true)
          {
            echo "era=$era"
            echo "cddl=$cddl"
            echo "samples=$samples"
          } >> "$GITHUB_OUTPUT"
      # Exit codes from nextest-metadata's exit_codes.rs at cargo-nextest 0.9.151.
      - name: Report the comparison's result
        if: always()
        env:
          JOB: ${{ job.status }}
          RC: ${{ steps.run.outputs.rc }}
          ERA: ${{ steps.ledger.outputs.era }}
          CDDL: ${{ steps.ledger.outputs.cddl }}
          SAMPLES: ${{ steps.ledger.outputs.samples }}
        run: |
          at="at dolos ${DOLOS_REF:0:8}"
          if [ "$JOB" = success ] && [ "$RC" = 0 ]; then
            state=success description="nextest exited 0 $at"
          elif [ "$JOB" = cancelled ]; then
            state=error description="cancelled or timed out before a result $at"
          elif [ "$RC" = 101 ] && [ -n "$CDDL" ] && [ -n "$SAMPLES" ]; then
            state=failure
            description="does not compile, pallas $ERA cddl from ledger ${CDDL:0:12}, samples from ${SAMPLES:0:12}, $at"
          else
            case "$RC" in
              '') state=error description="failed before nextest ran $at" ;;
              4) state=failure description="nextest exited 4, no tests ran $at" ;;
              100) state=failure description="nextest exited 100, a test failed $at" ;;
              101) state=failure description="nextest exited 101, the build failed $at" ;;
              *) state=failure description="nextest exited $RC $at" ;;
            esac
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="${description:0:140}"

  stable:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.stable) }}
    env:
      TARGET: ${{ matrix.target }}
      CONTEXT: reference-comparison/${{ matrix.target }}
      SHA: ${{ needs.targets.outputs.sha }}
      BASE: ${{ inputs.pallas_base }}
      READINGS: ${{ github.workspace }}/base-readings.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report the comparison as running
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="running at dolos ${DOLOS_REF:0:8}"
      - name: Require a base
        run: |
          if [ -z "$BASE" ]; then
            echo "::error::a stable comparison needs the pallas_base input"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/dolos
          ref: ${{ env.DOLOS_REF }}
          path: dolos
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          key: ${{ matrix.target }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          path: pallas-head
          persist-credentials: false
      - name: Write the base's readings
        id: base
        working-directory: dolos/reference-comparison
        run: |
          echo "sha=$(git -C ../../pallas-head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          STABLE_READINGS_WRITE="$READINGS" \
            cargo nextest run --no-default-features --features stable --run-ignored all --test "$TARGET"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.sha }}
          path: pallas-head
          persist-credentials: false
      - name: Compare this build's readings with the base's
        id: run
        working-directory: dolos/reference-comparison
        run: |
          rc=0
          STABLE_READINGS_BASE="$READINGS" \
            cargo nextest run --no-fail-fast --no-default-features --features stable --run-ignored all \
            --test "$TARGET" > "$RUNNER_TEMP/compare.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/compare.out"
          differ=$(grep -oE 'stable [a-z]+: [0-9]+ of [0-9]+ samples differ$' "$RUNNER_TEMP/compare.out" | head -n 1 || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "differ=$differ" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # Exit codes from nextest-metadata's exit_codes.rs at cargo-nextest 0.9.151.
      - name: Report the comparison's result
        if: always()
        env:
          JOB: ${{ job.status }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_RESULT: ${{ steps.base.outcome }}
          RC: ${{ steps.run.outputs.rc }}
          DIFFER: ${{ steps.run.outputs.differ }}
        run: |
          at="from base ${BASE_SHA:0:8} at dolos ${DOLOS_REF:0:8}"
          read_base=$(jq -r '.pallas // empty' "$READINGS" 2>/dev/null || true)
          if [ "$JOB" = cancelled ]; then
            state=error description="cancelled or timed out before a result $at"
          elif [ -z "$BASE" ]; then
            state=error description="no pallas_base input, so nothing was compared at dolos ${DOLOS_REF:0:8}"
          elif [ "$BASE_RESULT" != success ] || [ -z "$BASE_SHA" ] || [ "$read_base" != "$BASE_SHA" ]; then
            state=error description="the base's readings were not written $at"
          elif [ "$RC" = 0 ] && [ "$JOB" = success ] && [[ "$DIFFER" =~ ^stable\ [a-z]+:\ 0\ of\ [1-9][0-9]*\ samples\ differ$ ]]; then
            state=success description="$DIFFER $at"
          elif [ -n "$DIFFER" ]; then
            state=failure description="$DIFFER $at"
          else
            case "$RC" in
              '') state=error description="failed before nextest ran $at" ;;
              4) state=failure description="nextest exited 4, no tests ran $at" ;;
              101) state=failure description="nextest exited 101, the build failed $at" ;;
              *) state=failure description="nextest exited $RC with no count of differing samples $at" ;;
            esac
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="${description:0:140}"
