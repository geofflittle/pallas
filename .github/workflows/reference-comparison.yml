name: Reference comparison

# GitHub dispatches a workflow off the default branch only after a run of it, which the push makes.
on:
  push:
    paths: [.github/workflows/reference-comparison.yml]
  workflow_dispatch:
    inputs:
      pallas_ref:
        description: The pallas commit to compare and report on
        required: true

permissions:
  contents: read
  statuses: write

env:
  DOLOS_REF: a26803698e4d6fc867f1e80a69e9612cd783a46f
  TOOLCHAIN: nightly-2026-09-04
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  targets:
    name: targets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      targets: ${{ steps.list.outputs.targets }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pallas_ref }}
          path: pallas-head
          persist-credentials: false
      - name: Resolve the pallas commit
        id: commit
        working-directory: pallas-head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/dolos
          ref: ${{ env.DOLOS_REF }}
          path: dolos
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - name: List the comparison's test targets
        id: list
        working-directory: dolos/reference-comparison
        run: |
          targets=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[] | select(.name == "reference-comparison") | .targets[] | select(.kind | index("test")) | .name]')
          if [ "$(jq length <<< "$targets")" = 0 ]; then
            echo "::error::the Dolos comparison at $DOLOS_REF declares no test target"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - name: Report every target as pending
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TARGETS: ${{ steps.list.outputs.targets }}
        run: |
          for target in $(jq -r '.[]' <<< "$TARGETS"); do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
              -f context="reference-comparison/$target" -f target_url="$RUN_URL" \
              -f description="queued at dolos ${DOLOS_REF:0:8}"
          done

  compare:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      CONTEXT: reference-comparison/${{ matrix.target }}
      SHA: ${{ needs.targets.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.sha }}
          path: pallas-head
          persist-credentials: false
      - name: Report the comparison as running
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="running at dolos ${DOLOS_REF:0:8}"
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/dolos
          ref: ${{ env.DOLOS_REF }}
          path: dolos
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          key: ${{ matrix.target }}
      - name: Run the comparison
        id: run
        working-directory: dolos/reference-comparison
        run: |
          rc=0
          cargo nextest run --no-fail-fast --run-ignored all --test "$TARGET" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # The ledger commit pallas copied the era's CDDL from, and the one that wrote the era's samples.
      - name: Read the era's ledger commits
        id: ledger
        if: always() && startsWith(matrix.target, 'dataset-')
        run: |
          era=${TARGET#dataset-}
          cddl=$(head -n 1 "pallas-head/pallas-primitives/src/$era/defs.cddl" 2>/dev/null \
            | grep -oE 'cardano-ledger commit [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)
          samples=$(jq -r '.implementation_commit // empty' \
            "dolos/test_data/cardano-cbor-dataset/dataset/reports/$era/haskell-latest.json" 2>/dev/null \
            | grep -xE '[0-9a-f]{40}' || true)
          {
            echo "era=$era"
            echo "cddl=$cddl"
            echo "samples=$samples"
          } >> "$GITHUB_OUTPUT"
      # Exit codes from nextest-metadata's exit_codes.rs at cargo-nextest 0.9.151.
      - name: Report the comparison's result
        if: always()
        env:
          JOB: ${{ job.status }}
          RC: ${{ steps.run.outputs.rc }}
          ERA: ${{ steps.ledger.outputs.era }}
          CDDL: ${{ steps.ledger.outputs.cddl }}
          SAMPLES: ${{ steps.ledger.outputs.samples }}
        run: |
          at="at dolos ${DOLOS_REF:0:8}"
          if [ "$JOB" = success ] && [ "$RC" = 0 ]; then
            state=success description="nextest exited 0 $at"
          elif [ "$JOB" = cancelled ]; then
            state=error description="cancelled or timed out before a result $at"
          elif [ "$RC" = 101 ] && [ -n "$CDDL" ] && [ -n "$SAMPLES" ]; then
            state=failure
            description="does not compile, pallas $ERA cddl from ledger ${CDDL:0:12}, samples from ${SAMPLES:0:12}, $at"
          else
            case "$RC" in
              '') state=error description="failed before nextest ran $at" ;;
              4) state=failure description="nextest exited 4, no tests ran $at" ;;
              100) state=failure description="nextest exited 100, a test failed $at" ;;
              101) state=failure description="nextest exited 101, the build failed $at" ;;
              *) state=failure description="nextest exited $RC $at" ;;
            esac
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="${description:0:140}"
